version = 1
SPDX-PackageName = "Kodex"
SPDX-PackageSupplier = "incident201 <58225046+incident201@users.noreply.github.com>"
SPDX-PackageDownloadLocation = "https://github.com/incident201/Kodex"

# Documentation, metadata and project configuration.
[[annotations]]
path = [
    "README.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "docs/**",
    "protocol/README.md",
    ".gitignore",
    ".clang-format",
    ".kde-ci.yml",
    "tests/requirements.txt",
    "data/*.desktop",
    "data/*.metainfo.xml",
    "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 incident201 <58225046+incident201@users.noreply.github.com>"
SPDX-License-Identifier = "CC0-1.0"

# Translation catalogs and the application icon.
[[annotations]]
path = ["po/**", "data/*.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 incident201 <58225046+incident201@users.noreply.github.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The JSON schema generated by `codex app-server generate-json-schema` (Apache-2.0).
[[annotations]]
path = "protocol/codex-*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "OpenAI"
SPDX-License-Identifier = "Apache-2.0"
